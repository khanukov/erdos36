name: verify-priority-package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERIFICATION_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install verifier and manuscript dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgmp-dev libmpfr-dev latexmk lmodern \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Verify one fresh composite chain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make verify
      - name: Cross-check central certificate at 128-bit MPFR precision
        run: make verify-central-128
      - name: Build manuscript
        run: make paper
      - name: Build normalized allowlisted release candidate
        run: python scripts/build_release.py
      - name: Verify release candidate closure and provenance
        run: python scripts/verify_release.py
      - name: Upload verification evidence and release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: erdos36-priority-package-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/*.json
            build/*.log
            build/*.rc
            build/*.pdf
            build/*.zip
            build/*.sha256
